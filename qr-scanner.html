<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>סריקת QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1116;
    --bg-panel: #171B22;
    --text: #EDEFF2;
    --text-dim: #8B93A1;
    --text-on-accent: #1A0F04;
    --accent: #FF8A34;
    --accent-soft: rgba(255,138,52,0.14);
    --border: #262B34;
    --danger: #E5484D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  header h1{ margin:0; font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }
  header h1 .ico{ color: var(--accent); }

  main{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#000; }
  video{ width:100%; height:100%; object-fit:cover; }
  canvas{ display:none; }

  .guide{
    position:absolute;
    width: min(62vw, 62vh);
    height: min(62vw, 62vh);
    border: 3px solid var(--accent);
    border-radius: 18px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events:none;
  }
  .guide::before, .guide::after{ content:none; }

  .state-msg{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding: 30px;
    background: var(--bg);
  }
  .state-msg .big-ico{ font-size:40px; }
  .state-msg h2{ margin:0; font-size:17px; }
  .state-msg p{ margin:0; color: var(--text-dim); font-size:13.5px; max-width:320px; line-height:1.5; }
  .retry-btn{
    background: var(--accent); color: var(--text-on-accent); border:none;
    border-radius: 10px; padding: 10px 22px; font-weight:800; font-size:14px;
    font-family:inherit; cursor:pointer; margin-top:6px;
  }

  /* ---- Result sheet ---- */
  .result-sheet{
    position:absolute;
    left:0; right:0; bottom:0;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 18px 20px 22px;
    display:none;
    flex-direction:column;
    gap:12px;
  }
  .result-sheet.show{ display:flex; }
  .result-label{ font-size:11.5px; color: var(--text-dim); }
  .result-value{
    font-size: 15px;
    font-weight: 600;
    word-break: break-all;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    max-height: 100px;
    overflow-y:auto;
  }
  .result-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn{
    flex:1;
    min-width: 100px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 10px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .action-btn.primary{ background: var(--accent); color: var(--text-on-accent); border-color: var(--accent); }
  .action-btn:active{ opacity:0.75; }
  .sent-note{ font-size:12px; color: var(--accent); text-align:center; display:none; }
</style>
</head>
<body>

<header>
  <h1><span class="ico">▦</span> סריקת QR</h1>
</header>

<main id="main">
  <video id="video" autoplay playsinline muted></video>
  <div class="guide" id="guide" style="display:none;"></div>
  <canvas id="canvas"></canvas>

  <div class="state-msg" id="stateMsg">
    <div class="big-ico">📷</div>
    <h2>מבקש גישה למצלמה...</h2>
    <p>ברכב, זה עובד רק כשחונים, ורק אם המערכת עודכנה לגרסת הקיץ 2026 ומעלה</p>
  </div>

  <div class="result-sheet" id="resultSheet">
    <div>
      <div class="result-label">נסרק:</div>
      <div class="result-value" id="resultValue"></div>
    </div>
    <div class="result-actions">
      <button class="action-btn primary" id="openBtn" style="display:none;">פתח קישור</button>
      <button class="action-btn" id="copyBtn">העתק</button>
      <button class="action-btn" id="sendChatBtn">שלח לצ'אט</button>
      <button class="action-btn" id="rescanBtn">סרוק שוב</button>
    </div>
    <div class="sent-note" id="sentNote">✓ נשלח לצ'אט</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // אותו פרויקט Firebase של הצ'אט, כדי שאפשר יהיה לשלוח תוצאה ישירות ללוג
  const firebaseConfig = {
    apiKey: "AIzaSyBtOg6Bq9Q02iR_G1TSlN7pSZ0wNHp-PdM",
    authDomain: "tesdb-d3a16.firebaseapp.com",
    databaseURL: "https://tesdb-d3a16-default-rtdb.firebaseio.com",
    projectId: "tesdb-d3a16",
  };
  const ROOM = "main";
  firebase.initializeApp(firebaseConfig);
  const messagesRef = firebase.database().ref(`chat/${ROOM}/messages`);
  const whoAmI = navigator.userAgent.includes("Tesla") ? "טסלה" : "טלפון";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const guide = document.getElementById("guide");
  const stateMsg = document.getElementById("stateMsg");
  const resultSheet = document.getElementById("resultSheet");
  const resultValue = document.getElementById("resultValue");
  const openBtn = document.getElementById("openBtn");
  const copyBtn = document.getElementById("copyBtn");
  const sendChatBtn = document.getElementById("sendChatBtn");
  const rescanBtn = document.getElementById("rescanBtn");
  const sentNote = document.getElementById("sentNote");

  let scanning = false;
  let rafId = null;

  function showState(icon, title, desc, showRetry){
    stateMsg.style.display = "flex";
    resultSheet.classList.remove("show");
    guide.style.display = "none";
    stateMsg.innerHTML = `
      <div class="big-ico">${icon}</div>
      <h2>${title}</h2>
      <p>${desc}</p>
      ${showRetry ? '<button class="retry-btn" id="retryBtn">נסה שוב</button>' : ""}`;
    if (showRetry) document.getElementById("retryBtn").addEventListener("click", start);
  }

  function isUrl(text){
    return /^https?:\/\//i.test(text) || /^[a-z0-9-]+\.[a-z]{2,}/i.test(text.split(/\s/)[0] || "");
  }
  function normalizeUrl(text){
    return /^https?:\/\//i.test(text) ? text : "https://" + text;
  }

  async function start(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showState("🚫", "אין תמיכה במצלמה בדפדפן הזה", "אם זה בטסלה - כנראה שהרכב עדיין לא עודכן לגרסה עם גישת מצלמה (2026.26+), או שהחומרה לא תומכת (רק AMD Ryzen).", false);
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      await video.play();
      stateMsg.style.display = "none";
      guide.style.display = "block";
      resultSheet.classList.remove("show");
      scanning = true;
      tick();
    }catch(err){
      if (err.name === "NotAllowedError"){
        showState("🔒", "הגישה למצלמה נדחתה", "צריך לאשר גישה למצלמה בהקפצה של הדפדפן. אם לא הופיעה הקפצה - בטסלה זה אומר שהרכב חונה כרגע וזה נדרש, או שההרשאה נחסמה קודם.", true);
      } else if (err.name === "NotFoundError"){
        showState("📷", "לא נמצאה מצלמה", "ברכב זה אומר שהחומרה לא תומכת בפיצ'ר הזה (רק רכבים עם מחשב AMD Ryzen).", true);
      } else {
        showState("⚠️", "שגיאה בפתיחת המצלמה", err.message, true);
      }
    }
  }

  function tick(){
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data){
        onScanned(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function onScanned(text){
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    resultValue.textContent = text;
    resultSheet.classList.add("show");
    sentNote.style.display = "none";
    if (isUrl(text)){
      openBtn.style.display = "block";
      openBtn.onclick = () => window.open(normalizeUrl(text), "_blank");
    } else {
      openBtn.style.display = "none";
    }
    // ויברציה קטנה אם אפשר, לאישור סריקה
    if (navigator.vibrate) navigator.vibrate(80);
  }

  copyBtn.addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(resultValue.textContent);
      copyBtn.textContent = "הועתק ✓";
      setTimeout(() => copyBtn.textContent = "העתק", 1500);
    }catch(e){
      // fallback - בחירת הטקסט לצורך העתקה ידנית
      const range = document.createRange();
      range.selectNode(resultValue);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    }
  });

  sendChatBtn.addEventListener("click", () => {
    messagesRef.push({
      sender: whoAmI,
      text: resultValue.textContent,
      image: null,
      ts: Date.now()
    });
    sentNote.style.display = "block";
  });

  rescanBtn.addEventListener("click", () => {
    resultSheet.classList.remove("show");
    guide.style.display = "block";
    scanning = true;
    tick();
  });

  start();
</script>

</body>
</html>
