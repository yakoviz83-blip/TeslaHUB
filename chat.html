<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tesla ⇄ טלפון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1116;
    --bg-panel: #171B22;
    --bg-bubble-me: #FF8A34;
    --bg-bubble-them: #1B2029;
    --text: #EDEFF2;
    --text-dim: #8B93A1;
    --text-on-accent: #1A0F04;
    --accent: #FF8A34;
    --accent-soft: rgba(255,138,52,0.14);
    --border: #262B34;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  /* ---- Global nav (consistent across all mini-apps) ---- */
  .global-nav{
    display:flex; align-items:center; gap:10px;
    padding: 6px 16px;
    background: #05070a;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
    font-size:12.5px;
  }
  .global-home-btn{
    display:flex; align-items:center; gap:5px;
    color: var(--accent);
    text-decoration:none;
    font-weight:800;
    padding: 4px 10px;
    border-radius:999px;
    border:1px solid var(--border);
  }
  .global-home-btn:active{ background: var(--accent-soft); }
  .global-nav-title{ color: var(--text-dim); margin-inline-start:auto; letter-spacing:0.3px; }
  .global-app-icon{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    color: var(--text-dim);
    text-decoration:none;
    font-size:14px;
    flex-shrink:0;
  }
  .global-app-icon.active{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---- Header ---- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  header h1{ margin:0; font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }
  header h1 .ico{ color: var(--accent); }
  .who-badge{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor:pointer;
  }
  .who-badge b{ color: var(--text); }

  /* ---- Composer (top, always active) ---- */
  .composer{
    flex-shrink:0;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  .composer-row{ display:flex; align-items:flex-end; gap:10px; }
  .composer textarea{
    flex:1;
    resize:none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height:1.4;
    max-height: 90px;
    min-height: 44px;
  }
  .composer textarea:focus{ outline:none; border-color: var(--accent); }
  .send-btn{
    background: var(--accent);
    color: var(--text-on-accent);
    border:none;
    border-radius: 12px;
    padding: 12px 20px;
    font-weight:800;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:active{ opacity:0.8; }
  .attach-btn{
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 12px;
    width: 44px; height:44px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  .attach-btn:active{ background: var(--bg-panel); }
  .pending-img{
    margin-top: 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .pending-img img{ width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .pending-img button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .hint{ margin-top:6px; font-size:11.5px; color: var(--text-dim); }

  /* ---- Body split ---- */
  .body-split{ flex:1; display:flex; overflow:hidden; position:relative; }
  .log-col{ flex: 1 1 55%; display:flex; flex-direction:column; overflow:hidden; border-inline-end: 1px solid var(--border); min-width: 0; }
  .preview-col{ flex: 1 1 45%; display:flex; flex-direction:column; overflow:hidden; min-width: 0; }

  .resizer{
    flex-shrink:0;
    background: var(--border);
    position:relative;
    z-index:5;
  }
  .resizer::after{
    content:"";
    position:absolute;
    background: var(--text-dim);
    border-radius:3px;
  }
  .resizer.vertical{ width:5px; cursor: col-resize; }
  .resizer.vertical::after{ top:50%; left:50%; width:3px; height:32px; transform:translate(-50%,-50%); }
  .resizer.horizontal{ height:5px; cursor: row-resize; }
  .resizer.horizontal::after{ top:50%; left:50%; height:3px; width:32px; transform:translate(-50%,-50%); }
  .resizer:active::after{ background: var(--accent); }

  @media (max-width: 720px){
    .body-split{ flex-direction:column; }
    .log-col{ border-inline-end:none; border-bottom: 1px solid var(--border); }
  }

  .body-split.dragging{ user-select:none; }

  /* Maximize / minimize states for the preview panel */
  .body-split[data-state="max-preview"] .log-col,
  .body-split[data-state="max-preview"] .resizer{ display:none; }
  .body-split[data-state="max-preview"] .preview-col{ flex: 1 1 100%; }

  .body-split[data-state="min-preview"] .resizer{ display:none; }
  .body-split[data-state="min-preview"] .log-col{ flex: 1 1 100%; }
  .body-split[data-state="min-preview"] .preview-col{
    flex: 0 0 auto;
    width: 44px; height:auto;
  }
  .body-split[data-state="min-preview"] .preview-body{ display:none; }
  .body-split[data-state="min-preview"] .preview-header{ flex-direction:column; height:100%; padding: 10px 6px; gap:10px; }
  .body-split[data-state="min-preview"] .preview-header span{ display:none; }
  @media (max-width: 720px){
    .body-split[data-state="min-preview"] .preview-col{ width:auto; height:40px; }
    .body-split[data-state="min-preview"] .preview-header{ flex-direction:row; height:auto; }
  }

  .log{ flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap:10px; }
  .bubble-row{ display:flex; flex-direction:column; max-width: 78%; }
  .bubble-row.me{ align-self:flex-start; align-items:flex-start; }
  .bubble-row.them{ align-self:flex-end; align-items:flex-end; }
  .bubble{
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height:1.45;
    word-break: break-word;
  }
  .bubble-row.me .bubble{ background: var(--bg-bubble-them); color: var(--text); border-bottom-left-radius:4px; }
  .bubble-row.them .bubble{ background: var(--bg-bubble-me); color: var(--text-on-accent); border-bottom-right-radius:4px; }
  .bubble a.link-chip{
    display:inline-flex; align-items:center; gap:6px;
    background: rgba(0,0,0,0.18);
    padding: 5px 10px; border-radius:8px;
    text-decoration:none; color:inherit; font-weight:700;
    margin-top:4px; font-size:13px;
  }
  .bubble img.chat-img{
    max-width: 200px; border-radius:10px; display:block; margin-top:4px; cursor:pointer;
  }
  .meta{ font-size:10.5px; color: var(--text-dim); margin-top:3px; padding: 0 4px; }

  .empty-log{ margin:auto; text-align:center; color:var(--text-dim); font-size:13.5px; }

  /* ---- Preview panel ---- */
  .preview-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    flex-shrink:0; background: var(--bg-panel);
  }
  .preview-header span{ font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .preview-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px;
  }
  .preview-body{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; background: #05070a; }
  .preview-body iframe{ width:100%; height:100%; border:none; }
  .preview-body img{ max-width:100%; max-height:100%; object-fit:contain; }
  .preview-empty{ color: var(--text-dim); font-size:13.5px; text-align:center; padding: 20px; }
</style>
</head>
<body>

<div class="global-nav">
  <a href="index.html" class="global-home-btn">🏠 בית</a>
  <span class="global-nav-title" id="navTitle">TeslaHub</span>
</div>

<script>
  (function(){
    const GITHUB_USER = "yakoviz83-blip";
    const REPO = "TeslaHUB";
    const ICONS = { "chat.html": "💬", "chat-1.html": "💬", "qr-scanner.html": "▦" };
    const currentPage = location.pathname.split("/").pop() || "index.html";

    fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO}/contents/`)
      .then(r => r.ok ? r.json() : [])
      .then(items => {
        const nav = document.querySelector(".global-nav");
        const titleEl = document.getElementById("navTitle");
        items
          .filter(i => i.type === "file" && i.name.toLowerCase().endsWith(".html") && i.name.toLowerCase() !== "index.html")
          .sort((a,b) => a.name.localeCompare(b.name))
          .forEach(f => {
            const a = document.createElement("a");
            a.href = f.name;
            a.className = "global-app-icon" + (f.name === currentPage ? " active" : "");
            a.title = f.name.replace(".html","");
            a.textContent = ICONS[f.name] || "📄";
            nav.insertBefore(a, titleEl);
          });
      })
      .catch(() => {});
  })();
</script>

<header>
  <h1><span class="ico">💬</span> Tesla ⇄ טלפון</h1>
  <div class="who-badge" id="whoBadge">אני מזוהה בתור: <b id="whoLabel">...</b></div>
</header>

<div class="composer">
  <div class="composer-row">
    <textarea id="msgInput" placeholder="כתוב הודעה, הדבק קישור או תמונה..." rows="1"></textarea>
    <button class="attach-btn" id="attachBtn" title="צרף תמונה">📎</button>
    <input type="file" id="imgFileInput" accept="image/*" style="display:none;">
    <button class="attach-btn" id="pasteBtn" title="הדבק מהלוח">📋</button>
    <button class="send-btn" id="sendBtn">שלח</button>
  </div>
  <div class="pending-img" id="pendingImgBox" style="display:none;">
    <img id="pendingImgPreview" src="">
    <button id="pendingImgRemove">הסר תמונה</button>
  </div>
  <div class="hint">אפשר להדביק קישור, טקסט, או תמונה (Ctrl+V) ישירות לתוך השדה</div>
</div>

<div class="body-split" id="bodySplit" data-state="split">
  <div class="log-col">
    <div class="log" id="log">
      <div class="empty-log">עדיין אין הודעות. תכתוב משהו למעלה 👆</div>
    </div>
  </div>
  <div class="resizer vertical" id="resizer"></div>
  <div class="preview-col">
    <div class="preview-header">
      <span id="previewTitle">תצוגה מקדימה</span>
      <div class="preview-actions">
        <button class="icon-btn" id="minimizePreview" title="הקטן">–</button>
        <button class="icon-btn" id="maximizePreview" title="הגדל למסך מלא">⤢</button>
        <button class="icon-btn" id="openExternal" title="פתח בטאב חדש" style="display:none;">↗</button>
        <button class="icon-btn" id="closePreview" title="סגור">✕</button>
      </div>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty">קישורים ותמונות שתלחצו עליהם בלוג יופיעו כאן</div>
    </div>
  </div>
</div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // =========================================================
  // הגדרות - למלא אחרי יצירת פרויקט Firebase (חינמי)
  // =========================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBtOg6Bq9Q02iR_G1TSlN7pSZ0wNHp-PdM",
    authDomain: "tesdb-d3a16.firebaseapp.com",
    databaseURL: "https://tesdb-d3a16-default-rtdb.firebaseio.com",
    projectId: "tesdb-d3a16",
  };
  const ROOM = "main"; // אפשר לשנות למשהו פרטי יותר אם רוצים
  const MAX_MESSAGES = 150;
  // =========================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref(`chat/${ROOM}/messages`);

  // ---- זיהוי מכשיר ----
  const WHO_KEY = "teslahub-chat-who";
  function detectDefaultWho(){
    return navigator.userAgent.includes("Tesla") ? "טסלה" : "טלפון";
  }
  let whoAmI = localStorage.getItem(WHO_KEY) || detectDefaultWho();
  document.getElementById("whoLabel").textContent = whoAmI;

  document.getElementById("whoBadge").addEventListener("click", () => {
    whoAmI = whoAmI === "טסלה" ? "טלפון" : "טסלה";
    localStorage.setItem(WHO_KEY, whoAmI);
    document.getElementById("whoLabel").textContent = whoAmI;
  });

  // ---- זיהוי קישורים והפיכתם ללחיצים ----
  // תופס גם קישורים עם http/https, וגם דומיין בלי פרוטוקול (google.co.il, YouTube.com)
  const URL_RE = /\b((?:https?:\/\/)?(?:www\.)?[a-zA-Z0-9][a-zA-Z0-9-]{0,62}(?:\.[a-zA-Z0-9][a-zA-Z0-9-]{0,62})+(?:\/[^\s]*)?)\b/gi;
  function renderText(text){
    const escaped = text.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    return escaped.replace(URL_RE, raw => {
      const url = normalizeUrl(raw);
      return `<a href="#" class="link-chip" data-url="${url}">🔗 ${shortenUrl(url)}</a>`;
    });
  }
  function normalizeUrl(raw){
    return /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
  }
  function shortenUrl(url){
    try{
      const u = new URL(url);
      return u.hostname.replace("www.","") + (u.pathname !== "/" ? u.pathname.slice(0,18) : "");
    }catch(e){ return url.slice(0,30); }
  }
  // המרה אוטומטית של קישורי יוטיוב לגרסה המוטבעת (מרשה הטמעה, בניגוד לדף הרגיל)
  function toEmbeddable(url){
    try{
      const u = new URL(url);
      const host = u.hostname.replace("www.","");
      if (host === "youtube.com" && u.searchParams.get("v")){
        return `https://www.youtube.com/embed/${u.searchParams.get("v")}`;
      }
      if (host === "youtu.be"){
        return `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
      }
      return url;
    }catch(e){ return url; }
  }

  // ---- תצוגה מקדימה (פאנל צד) ----
  const previewBody = document.getElementById("previewBody");
  const previewTitle = document.getElementById("previewTitle");
  const openExternalBtn = document.getElementById("openExternal");

  function openPreviewLink(url){
    const embedUrl = toEmbeddable(url);
    previewTitle.textContent = shortenUrl(url);
    previewBody.innerHTML = `
      <div style="width:100%;height:100%;display:flex;flex-direction:column;">
        <div style="flex-shrink:0;padding:8px 12px;background:#12151b;color:var(--text-dim);font-size:11.5px;border-bottom:1px solid var(--border);text-align:center;">
          🔒 חלק מהאתרים חוסמים תצוגה מוטבעת — אם ריק, לחץ ↗ למעלה לפתיחה בטאב חדש
        </div>
        <iframe src="${embedUrl}" style="flex:1;"></iframe>
      </div>`;
    openExternalBtn.style.display = "inline-block";
    openExternalBtn.onclick = () => window.open(url, "_blank");
  }
  function openPreviewImage(dataUrl){
    previewTitle.textContent = "תמונה";
    previewBody.innerHTML = `<img src="${dataUrl}">`;
    openExternalBtn.style.display = "none";
  }
  document.getElementById("closePreview").addEventListener("click", () => {
    previewTitle.textContent = "תצוגה מקדימה";
    previewBody.innerHTML = `<div class="preview-empty">קישורים ותמונות שתלחצו עליהם בלוג יופיעו כאן</div>`;
    openExternalBtn.style.display = "none";
  });

  // ---- רינדור הלוג ----
  const logEl = document.getElementById("log");
  function timeStr(ts){
    return new Date(ts).toLocaleTimeString("he-IL", { hour:"2-digit", minute:"2-digit" });
  }

  function renderMessages(snapshotVal){
    logEl.innerHTML = "";
    const entries = Object.values(snapshotVal || {}).sort((a,b) => a.ts - b.ts);
    if (entries.length === 0){
      logEl.innerHTML = `<div class="empty-log">עדיין אין הודעות. תכתוב משהו למעלה 👆</div>`;
      return;
    }
    entries.forEach(msg => {
      const row = document.createElement("div");
      row.className = "bubble-row " + (msg.sender === whoAmI ? "me" : "them");
      let inner = "";
      if (msg.text) inner += `<div>${renderText(msg.text)}</div>`;
      if (msg.image) inner += `<img class="chat-img" src="${msg.image}">`;
      row.innerHTML = `
        <div class="bubble">${inner}</div>
        <div class="meta">${msg.sender} · ${timeStr(msg.ts)}</div>`;
      logEl.appendChild(row);
    });
    logEl.scrollTop = logEl.scrollHeight;

    // חיבור לחיצות על קישורים/תמונות
    logEl.querySelectorAll(".link-chip").forEach(el => {
      el.addEventListener("click", e => { e.preventDefault(); openPreviewLink(el.dataset.url); });
    });
    logEl.querySelectorAll(".chat-img").forEach(el => {
      el.addEventListener("click", () => openPreviewImage(el.src));
    });
  }

  messagesRef.limitToLast(MAX_MESSAGES).on("value", snap => renderMessages(snap.val()));

  // ---- שליחת הודעות ----
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const pendingImgBox = document.getElementById("pendingImgBox");
  const pendingImgPreview = document.getElementById("pendingImgPreview");
  let pendingImageData = null;

  msgInput.addEventListener("input", () => {
    msgInput.style.height = "auto";
    msgInput.style.height = Math.min(msgInput.scrollHeight, 90) + "px";
  });

  msgInput.addEventListener("paste", e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items){
      if (item.type.startsWith("image/")){
        e.preventDefault();
        const file = item.getAsFile();
        compressImage(file, dataUrl => {
          pendingImageData = dataUrl;
          pendingImgPreview.src = dataUrl;
          pendingImgBox.style.display = "flex";
        });
        return;
      }
    }
    // טקסט/קישור - מתנהג כברירת מחדל של הדפדפן (נכנס לשדה כרגיל)
  });

  document.getElementById("pendingImgRemove").addEventListener("click", () => {
    pendingImageData = null;
    pendingImgBox.style.display = "none";
  });

  const pasteBtn = document.getElementById("pasteBtn");
  pasteBtn.addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        const start = msgInput.selectionStart || msgInput.value.length;
        const end = msgInput.selectionEnd || msgInput.value.length;
        msgInput.value = msgInput.value.slice(0, start) + text + msgInput.value.slice(end);
        msgInput.dispatchEvent(new Event("input"));
        msgInput.focus();
      }
    } catch (e) {
      alert("לא ניתן לגשת ללוח - נסה להדביק ידנית לתוך השדה (לחיצה ארוכה על השדה ואז הדבק)");
    }
  });

  const attachBtn = document.getElementById("attachBtn");
  const imgFileInput = document.getElementById("imgFileInput");
  attachBtn.addEventListener("click", () => imgFileInput.click());
  imgFileInput.addEventListener("change", () => {
    const file = imgFileInput.files[0];
    if (!file) return;
    compressImage(file, dataUrl => {
      pendingImageData = dataUrl;
      pendingImgPreview.src = dataUrl;
      pendingImgBox.style.display = "flex";
    });
    imgFileInput.value = ""; // מאפשר לבחור אותה תמונה שוב בפעם הבאה
  });

  function compressImage(file, cb){
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function sendMessage(){
    const text = msgInput.value.trim();
    if (!text && !pendingImageData) return;
    messagesRef.push({
      sender: whoAmI,
      text: text || null,
      image: pendingImageData || null,
      ts: Date.now()
    });
    msgInput.value = "";
    msgInput.style.height = "44px";
    pendingImageData = null;
    pendingImgBox.style.display = "none";
    trimOldMessages();
  }

  function trimOldMessages(){
    messagesRef.once("value", snap => {
      const val = snap.val();
      if (!val) return;
      const keys = Object.keys(val);
      if (keys.length <= MAX_MESSAGES + 20) return;
      const sortedKeys = keys.sort((a,b) => val[a].ts - val[b].ts);
      const toRemove = sortedKeys.slice(0, sortedKeys.length - MAX_MESSAGES);
      toRemove.forEach(k => messagesRef.child(k).remove());
    });
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  // ---- גרירה לשינוי גודל בין הלוג לפאנל, והגדלה/הקטנה ----
  const bodySplit = document.getElementById("bodySplit");
  const logCol = document.querySelector(".log-col");
  const previewCol = document.querySelector(".preview-col");
  const resizer = document.getElementById("resizer");
  const maximizeBtn = document.getElementById("maximizePreview");
  const minimizeBtn = document.getElementById("minimizePreview");

  function isStacked(){ return window.matchMedia("(max-width: 720px)").matches; }

  resizer.addEventListener("pointerdown", e => {
    if (bodySplit.dataset.state !== "split") return;
    resizer.setPointerCapture(e.pointerId);
    bodySplit.classList.add("dragging");

    const onMove = ev => {
      const rect = bodySplit.getBoundingClientRect();
      let ratio;
      if (isStacked()){
        ratio = (ev.clientY - rect.top) / rect.height;
      } else {
        // דף RTL - הלוג בצד ימין, הפאנל בצד שמאל
        ratio = 1 - ((ev.clientX - rect.left) / rect.width);
      }
      ratio = Math.min(0.8, Math.max(0.2, ratio));
      logCol.style.flex = `1 1 ${ratio * 100}%`;
      previewCol.style.flex = `1 1 ${(1 - ratio) * 100}%`;
    };
    const onUp = () => {
      bodySplit.classList.remove("dragging");
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });

  maximizeBtn.addEventListener("click", () => {
    if (bodySplit.dataset.state === "max-preview"){
      bodySplit.dataset.state = "split";
      maximizeBtn.textContent = "⤢";
      maximizeBtn.title = "הגדל למסך מלא";
    } else {
      bodySplit.dataset.state = "max-preview";
      maximizeBtn.textContent = "⤡";
      maximizeBtn.title = "חזור לתצוגה מפוצלת";
    }
  });

  minimizeBtn.addEventListener("click", () => {
    if (bodySplit.dataset.state === "min-preview"){
      bodySplit.dataset.state = "split";
      minimizeBtn.textContent = "–";
      minimizeBtn.title = "הקטן";
    } else {
      bodySplit.dataset.state = "min-preview";
      minimizeBtn.textContent = "▢";
      minimizeBtn.title = "החזר לגודל רגיל";
    }
  });
</script>

</body>
